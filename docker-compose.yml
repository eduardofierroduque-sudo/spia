services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - SPIA_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:?err}:${POSTGRES_PASSWORD:?err}@db:5432/${POSTGRES_DB:-spia}
      - SPIA_REDIS_URL=redis://redis:6379/0
      - SPIA_CELERY_BROKER_URL=redis://redis:6379/1
      - SPIA_API_KEY=${SPIA_API_KEY:?err}
      - SPIA_HIBP_API_KEY=${SPIA_HIBP_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./ml/models/trained:/app/ml/models/trained:ro
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.worker.tasks.celery_app worker --loglevel=info --concurrency=4
    env_file:
      - .env
    environment:
      - SPIA_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:?err}:${POSTGRES_PASSWORD:?err}@db:5432/${POSTGRES_DB:-spia}
      - SPIA_REDIS_URL=redis://redis:6379/0
      - SPIA_CELERY_BROKER_URL=redis://redis:6379/1
      - SPIA_API_KEY=${SPIA_API_KEY:?err}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./ml/models/trained:/app/ml/models/trained:ro
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - api
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?err}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?err}
      POSTGRES_DB: ${POSTGRES_DB:-spia}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save 900 1
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
